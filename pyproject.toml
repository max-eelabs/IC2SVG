[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-pinout-illustrator"
version = "0.1.0"
description = "Deterministic IC package and pinout rendering"
authors = [{name = "Maxim Pavlov", email = "pavlov.web@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["Pillow==12.2.0", "fonttools==4.60.1", "jsonschema==4.25.1"]

[tool.setuptools.packages.find]
include = ["components*"]
exclude = ["components.*.tests", "components.*.tests.*"]

[tool.setuptools.package-data]
"components.input" = ["schema.json"]
"*" = ["samples/*.svg", "variants/*.json", "variant.schema.json"]
